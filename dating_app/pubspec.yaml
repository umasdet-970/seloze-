name: connect_dating_app
description: Premium dating app - Flutter/Riverpod/Firebase
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase. Code against these is written and gated behind kUseFirebase
  # (see lib/core/config/backend_config.dart) — safe to fetch even before
  # you've run `flutterfire configure`, since nothing calls
  # Firebase.initializeApp() until that flag flips to true.
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1
  google_sign_in: ^6.2.1

  # Swipe cards
  flutter_card_swiper: ^7.0.1

  # Camera/gallery photo picker (Firebase Storage upload path)
  image_picker: ^1.1.2

  # UI helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Payments (RevenueCat). Gated behind kUseRevenueCat, same story as the
  # Firebase deps above — safe to fetch before you have a RevenueCat
  # account, since Purchases.configure() is never called until then.
  purchases_flutter: ^8.4.4
  url_launcher: ^6.3.1 # deep-links to Play Store's own subscription-management UI (see cancelAutoRenew)

  # Ads for free-tier users (spec section 18). Uses Google's public TEST
  # ad unit/app IDs (see lib/core/config/ad_config.dart) — unlike Firebase/
  # RevenueCat above, these work with no AdMob account at all, so kUseAds
  # defaults true rather than false.
  #
  # Pinned to >=7.0.0 (not the ^5.1.0 originally used): every version
  # from 5.1.0 through 6.x has a Gradle 9-incompatible `build.gradle`
  # (`for (config : configurations.all)`, invalid on Gradle 9's
  # ConfigurationContainer) — 7.0.0 is the first release that rewrote
  # this to `configurations.any { }`. Confirmed by downloading and
  # diffing each version's android/build.gradle directly, not just the
  # changelog. No breaking Dart API changes between 5.x and 7.x affect
  # the Banner Ad surface this app uses (BannerAd/AdWidget/AdRequest/
  # BannerAdListener/MobileAds.instance.initialize) — see that version's
  # CHANGELOG.md for the full (unrelated: native-ad-template, mediation,
  # AdMessageCodec) list of what actually changed.
  google_mobile_ads: ^7.0.0

  # Real-time push/text/photo moderation (spec section 12/19), calling
  # Cloud Functions that wrap Cloud Vision / Cloud Natural Language.
  # Gated behind kUseCloudModeration, same story as Firebase above.
  cloud_functions: ^5.1.3

  # Real geo-distance in Discover (spec section 4/15). Device location
  # permission + position, used to compute real Haversine distance
  # between users instead of the old distanceKm=0 placeholder. Works
  # standalone, no account needed — the user just has to grant the
  # permission (handled gracefully if denied, see LocationService).
  geolocator: ^13.0.1

  # Foreground push presentation (spec section 7/13). FirebaseMessaging's
  # onMessage doesn't show anything on its own while the app is open —
  # this shows an actual heads-up local notification for it.
  flutter_local_notifications: ^18.0.1
  share_plus: ^13.3.0

  # Voice notes in chat (spec: Hinge/Bumble-style) — record a short clip
  # (record) and play back others' (audioplayers). Both actively
  # maintained with Gradle 9/AGP 8 support (see google_mobile_ads' note
  # above for why that specifically was checked, not assumed).
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Acquisition source (spec section 17), Android only — real Google
  # Play Install Referrer data (a first-party Play Store capability,
  # free, no AdMob/MMP account needed) once at first sign-up. Called
  # directly via a MethodChannel to Google's own
  # com.android.installreferrer library (see MainActivity.kt) rather
  # than the `android_play_install_referrer` pub.dev wrapper — that
  # package is stuck at compileSdk 33 with no newer release, which
  # fails Gradle's AAR-metadata check against this project's other
  # dependencies. See AcquisitionSourceService for the Dart side and
  # what this can/can't capture on iOS.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7B5CFA"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
