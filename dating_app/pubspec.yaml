name: connect_dating_app
description: Premium dating app - Flutter/Riverpod/Firebase
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase. Code against these is written and gated behind kUseFirebase
  # (see lib/core/config/backend_config.dart) — safe to fetch even before
  # you've run `flutterfire configure`, since nothing calls
  # Firebase.initializeApp() until that flag flips to true.
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1
  google_sign_in: ^6.2.1

  # Swipe cards
  flutter_card_swiper: ^7.0.1

  # Camera/gallery photo picker (Firebase Storage upload path)
  image_picker: ^1.1.2

  # UI helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Payments (RevenueCat). Gated behind kUseRevenueCat, same story as the
  # Firebase deps above — safe to fetch before you have a RevenueCat
  # account, since Purchases.configure() is never called until then.
  purchases_flutter: ^8.4.4
  url_launcher: ^6.3.1 # deep-links to Play Store's own subscription-management UI (see cancelAutoRenew)

  # Ads for free-tier users (spec section 18). Uses Google's public TEST
  # ad unit/app IDs (see lib/core/config/ad_config.dart) — unlike Firebase/
  # RevenueCat above, these work with no AdMob account at all, so kUseAds
  # defaults true rather than false.
  google_mobile_ads: ^5.1.0

  # Real-time push/text/photo moderation (spec section 12/19), calling
  # Cloud Functions that wrap Cloud Vision / Cloud Natural Language.
  # Gated behind kUseCloudModeration, same story as Firebase above.
  cloud_functions: ^5.1.3

  # Real geo-distance in Discover (spec section 4/15). Device location
  # permission + position, used to compute real Haversine distance
  # between users instead of the old distanceKm=0 placeholder. Works
  # standalone, no account needed — the user just has to grant the
  # permission (handled gracefully if denied, see LocationService).
  geolocator: ^13.0.1

  # Foreground push presentation (spec section 7/13). FirebaseMessaging's
  # onMessage doesn't show anything on its own while the app is open —
  # this shows an actual heads-up local notification for it.
  flutter_local_notifications: ^18.0.1

  # Acquisition source (spec section 17), Android only — queries the
  # real Google Play Install Referrer API (a first-party Play Store
  # capability, free, no AdMob/MMP account needed) once at first
  # sign-up. See core/config docs and AcquisitionSourceService for what
  # this can and can't capture on iOS.
  android_play_install_referrer: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7B5CFA"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
