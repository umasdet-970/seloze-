name: connect_dating_app
description: Premium dating app - Flutter/Riverpod/Firebase
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase (uncomment when you run `flutterfire configure`)
  # firebase_core: ^3.3.0
  # firebase_auth: ^5.1.4
  # cloud_firestore: ^5.2.1
  # firebase_storage: ^12.1.3
  # firebase_messaging: ^15.0.4

  # Swipe cards
  flutter_card_swiper: ^7.0.1

  # UI helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Payments (uncomment when ready)
  # purchases_flutter: ^7.27.0  # RevenueCat

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
